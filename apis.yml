aid: climate-engine
url: https://raw.githubusercontent.com/api-evangelist/climate-engine/refs/heads/main/apis.yml
name: Climate Engine
kind: company
description: Climate Engine is a geospatial climate and remote-sensing data platform
  that runs on Google Earth Engine. Its commercial REST API (api.climateengine.org)
  provides on-demand processing of satellite and gridded climate datasets - Landsat,
  Sentinel, MODIS, GRIDMET, ERA5, CHIRPS and more - returning timeseries, map tiles,
  zonal statistics, and pre-built reports over points, polygons, and feature collections.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Climate
- Geospatial
- Remote Sensing
- Satellite
- Earth Observation
