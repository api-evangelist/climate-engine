components:
  schemas:
    ExportStdDev:
      properties:
        dataset:
          type: string
          title: Dataset
          description: Dataset name
          default: GRIDMET
        variable:
          type: string
          title: Variable
          description: Variable name
          default: tmmx
        temporal_statistic:
          type: string
          title: Temporal Statistic
          description: temporal aggregation
          default: mean
        start_date:
          type: string
          format: date
          title: Start Date
          description: Start date
          default: '2010-06-01'
        end_date:
          type: string
          format: date
          title: End Date
          description: Start date
          default: '2010-06-30'
        start_year:
          type: integer
          title: Start Year
          default: 2016
        end_year:
          type: integer
          title: End Year
          default: 2018
        bounding_box:
          anyOf:
          - type: string
          - type: 'null'
          title: Bounding Box
          description: '[SW Lon, SW Lat, NE Lon, NE Lat]'
          default: ''
        map_mask:
          anyOf:
          - type: string
          - type: 'null'
          title: Map Mask
          default: ''
        export_path:
          type: string
          title: Export Path
          description: Export path to Google Cloud Bucket
          default: ncei-nidis/demo_image
        export_projection:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Projection
          default: ''
        export_resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Resolution
          default: ''
        priority:
          anyOf:
          - type: integer
            maximum: 9999.0
            minimum: 1.0
          - type: 'null'
          title: Priority
          description: Export job priority (1-9999)
      type: object
      title: ExportStdDev
      description: Base Model for ExportStdDev
    ExportDegreeDays:
      properties:
        dataset:
          type: string
          title: Dataset
          description: Dataset name
          default: GRIDMET
        variable:
          type: string
          title: Variable
          description: Variable name
          default: tmean
        dd_type:
          type: string
          title: Dd Type
          description: heating or cooling
          default: hdd
        value:
          type: number
          title: Value
          description: standard threshold
          default: 18.3
        start_date:
          type: string
          title: Start Date
          description: yyyy-mm-dd
          default: '2010-01-01'
        end_date:
          type: string
          title: End Date
          description: yyyy-mm-dd
          default: '2010-12-31'
        bounding_box:
          anyOf:
          - type: string
          - type: 'null'
          title: Bounding Box
          description: '[SW Lon, SW Lat, NE Lon, NE Lat]'
          default: ''
        map_mask:
          anyOf:
          - type: string
          - type: 'null'
          title: Map Mask
          default: ''
        export_path:
          type: string
          title: Export Path
          description: Export path to Google Cloud Bucket
          default: ncei-nidis/demo_image
        export_projection:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Projection
          default: ''
        export_resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Resolution
          default: ''
        priority:
          anyOf:
          - type: integer
            maximum: 9999.0
            minimum: 1.0
          - type: 'null'
          title: Priority
          description: Export job priority (1-9999)
      type: object
      title: ExportDegreeDays
      description: Base Model for ExportDegreeDays
    ExportDegreeDaysClimatologies:
      properties:
        dataset:
          type: string
          title: Dataset
          description: Dataset name
          default: GRIDMET
        variable:
          type: string
          title: Variable
          description: Variable name
          default: tmean
        dd_type:
          type: string
          title: Dd Type
          description: heating or cooling
          default: hdd
        value:
          type: number
          title: Value
          description: standard threshold
          default: 18.3
