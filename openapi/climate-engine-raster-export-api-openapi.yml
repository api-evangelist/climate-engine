        priority:
          anyOf:
          - type: integer
            maximum: 9999.0
            minimum: 1.0
          - type: 'null'
          title: Priority
          description: Export job priority (1-9999)
      type: object
      title: ExportDegreeDaysClimatologies
      description: Base Model for ExportDegreeDaysClimatologies
    ExportDateThresholdMannKendall:
