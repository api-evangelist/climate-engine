      properties:
        feature_collection_asset_id:
          type: string
          title: Feature Collection Asset Id
          description: Earth Engine FeatureCollection ID or Climate Engine Asset from [Climate Engine Assets](https://docs.climateengine.org/docs/build/html/climate_engine_assets.html)
          default: blm_ga_nv
        sub_choices:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Choices
          description: Column attribute values, e.g. Little Owyhee
          default: ''
        filter_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter By
          description: 'Column attribute in the asset to use as filter: e.g. Name'
          default: ''
        simplify_geometry:
          anyOf:
          - type: string
          - type: 'null'
          title: Simplify Geometry
          description: maxError in meters, see [ee.Feature.simplify](https://developers.google.com/earth-engine/apidocs/ee-feature-simplify)
          default: None
        buffer:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buffer
          description: Buffer in meters
        dataset:
          type: string
          title: Dataset
          description: Dataset name
          default: GRIDMET_DROUGHT
        variable:
          type: string
          title: Variable
          description: Variable name
          default: spi180d
        mask_image_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Image Id
          description: Asset ID of the mask image
          default: ''
        mask_band:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Band
          description: Band name to use in mask image
          default: ''
        mask_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Mask Value
          description: Mask value.
        bins:
          type: string
          title: Bins
          description: Bins to use in calculations
          default: '[-2.5, -2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2, 2.5]'
        start_date:
          type: string
          title: Start Date
          default: '2010-06-01'
        end_date:
          type: string
          title: End Date
          default: '2010-06-30'
        export_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Path
          description: Google Cloud Bucket Export Path
          default: ''
        export_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Format
          description: 'Export Format: json or csv'
          default: ''
      type: object
      title: PixelCountTimeseriesFeatureCollection
      description: Model for zonal_stats/pixel_count/timeseries/feature_collection
