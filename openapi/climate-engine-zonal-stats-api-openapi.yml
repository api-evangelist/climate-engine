        summary_img_id:
          type: string
          title: Summary Img Id
          description: Image Id
          default: CIESIN/GPWv411/GPW_Population_Count/gpw_v4_population_count_rev11_2020_30_sec
        summary_band:
          type: string
          title: Summary Band
          description: Summary BandName
          default: population_count
        mask_image_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Image Id
          description: Asset ID of the mask image
          default: ''
        mask_band:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Band
          description: Band name to use in mask image
          default: ''
        mask_value:
          anyOf:
          - type: number
