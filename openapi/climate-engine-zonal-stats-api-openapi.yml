          default: ''
        export_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Format
          description: 'Export Format: json or csv'
          default: ''
      type: object
      title: GroupByFeatureCollection
      description: Model for zonal_stats/pixel_count/feature_collection
