        buffer:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buffer
          description: Buffer in meters
        area_reducer:
          type: string
          title: Area Reducer
          description: Statistic over region
          default: sum
        group_img_id:
          type: string
          title: Group Img Id
          description: Image Id
          default: GRIDMET/DROUGHT/20200105
        group_band:
          type: string
