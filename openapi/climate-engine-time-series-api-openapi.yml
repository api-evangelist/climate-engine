openapi: 3.2.0
info:
  title: 'Climate Engine API v1: climate-engine-pro Timeseries API'
  version: 0.1.0
tags:
- name: Time Series
paths:
  /timeseries/native/coordinates:
    post:
      tags:
      - Time Series
      summary: Native Coordinates Post
      description: Native Time Series for Points or Polygons
      operationId: native_coordinates_post_timeseries_native_coordinates_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeCoordinates'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /timeseries/native/feature_collection:
