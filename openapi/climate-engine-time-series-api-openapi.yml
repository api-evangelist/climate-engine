components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    InterannualFeatureCollection:
      properties:
        feature_collection_asset_id:
          type: string
          title: Feature Collection Asset Id
          description: Earth Engine FeatureCollection ID or Climate Engine Asset from [Climate Engine Assets](https://docs.climateengine.org/docs/build/html/climate_engine_assets.html)
          default: blm_ga_nv
        sub_choices:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Choices
          description: Column attribute values, e.g. Little Owyhee
          default: ''
        filter_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter By
          description: 'Column attribute in the asset to use as filter: e.g. Name'
          default: ''
        simplify_geometry:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simplify Geometry
          description: maxError in meters, see [ee.Feature.simplify](https://developers.google.com/earth-engine/apidocs/ee-feature-simplify)
        buffer:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buffer
          description: Buffer in meters
        area_reducer:
          type: string
          title: Area Reducer
          description: Area reducer
          default: mean
        dataset:
          type: string
          title: Dataset
          description: Dataset name
          default: GRIDMET
        variable:
          type: string
          title: Variable
          description: Variable names
          default: tmmn, tmmx
        compute_trends:
          anyOf:
          - type: string
          - type: 'null'
          title: Compute Trends
          description: 'Comma seperated trends to be computed. Options: polyfit, sens_slope'
          default: ''
        mask_image_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Image Id
          description: Asset ID of the mask image
          default: ''
        mask_band:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Band
          description: Band name to use in mask image
          default: ''
        mask_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Mask Value
          description: Mask value.
        start_day:
          type: integer
          title: Start Day
          default: '01'
        end_day:
          type: integer
          title: End Day
          default: '30'
        start_month:
          type: integer
          title: Start Month
          default: '01'
        end_month:
          type: integer
          title: End Month
          default: '12'
        start_year:
          type: integer
          title: Start Year
          default: '1991'
        end_year:
          type: integer
          title: End Year
          default: '2020'
        temporal_statistic:
          type: string
          title: Temporal Statistic
          description: Temporal aggregation
          default: mean
        export_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Path
          description: Google Cloud Bucket Export Path
          default: ''
        export_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Format
          description: 'Export Format: json or csv'
          default: ''
      type: object
      title: InterannualFeatureCollection
