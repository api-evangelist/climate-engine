openapi: 3.2.0
info:
  title: 'Climate Engine API v1: climate-engine-pro Reports API'
  version: 0.1.0
tags:
- name: Reports
paths:
  /reports/site_characterization/coordinates:
    post:
      tags:
      - Reports
      summary: Site Characterization Coordinates Post
      description: Generate a site characterization report for a specific Polygon
      operationId: site_characterization_coordinates_post_reports_site_characterization_coordinates_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSiteCharacterizationCoordinates'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/site_characterization/feature_collection:
    post:
      tags:
      - Reports
      summary: Site Characterization Feature Collection Post
      description: Generate a site characterization report for a feature of an Earth Engine FeatureCollection
      operationId: site_characterization_feature_collection_post_reports_site_characterization_feature_collection_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
