components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReportDroughtFeatureCollection:
      properties:
        feature_collection_asset_id:
          type: string
          title: Feature Collection Asset Id
          description: Earth Engine FeatureCollection asset ID
          default: USGS/WBD/2017/HUC12
        sub_choices:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Choices
          description: Column attribute value.
          default: '140300051008'
        filter_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter By
          description: Column attribute to use as filter.
          default: huc12
        simplify_geometry:
          anyOf:
          - type: string
          - type: 'null'
          title: Simplify Geometry
          description: maxError in meters, see [ee.Feature.simplify](https://developers.google.com/earth-engine/apidocs/ee-feature-simplify)
          default: None
        report_version:
          type: string
          title: Report Version
          description: 'Report Version: v1 (gridMET Drought) or v2 (U.S. Drought Monitor, gridMET, and gridMET Drought)'
          default: v2
        end_date:
          type: string
          title: End Date
          description: The end date of the reporting period. Format yyyy-mm-dd.
          default: '2026-10-13'
        user_email:
          type: string
          title: User Email
          description: Valid email address
          default: ''
        site_name:
          type: string
          title: Site Name
          description: Site name, no special characters allowed
          default: example_site
        site_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Type
          description: Site type, no special characters allowed
        site_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Description
          description: Site description, no special characters allowed
        mask_landcover:
          type: string
          title: Mask Landcover
          description: 'Apply landcover mask: True or False'
          default: 'False'
        mask_ownership:
          type: string
          title: Mask Ownership
          description: Apply land ownership mask. One of ['None', 'BIA', 'BLM', 'DOD', 'FWS', 'NPS', 'USFS']
          default: None
        batch:
          anyOf:
          - type: string
          - type: boolean
          title: Batch
          description: Returns the link prior to processing the report if True
          default: 'True'
      type: object
      title: ReportDroughtFeatureCollection
