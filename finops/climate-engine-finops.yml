meters:
- name: api_requests
  description: Processing requests against the per-account request quota.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: raster_export_tasks
  description: Asynchronous raster export tasks queued and executed on Earth Engine.
  unit: tasks
  aggregation: sum
  dimensions:
  - account
- name: quota_allocation
  description: Provisioned request quota assigned to the API key under the agreement.
  unit: requests
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Poll GET /home/user/quotas to track request usage and remaining allowance per key.
- name: Allocation
  description: Issue separate API keys per workload/team and map them to internal cost centers.
- name: Optimization
  description: Prefer feature-collection and zonal-statistics endpoints over per-pixel exports where possible; cache dataset metadata; batch regions to reduce request count.
- name: Accountability
  description: Assign owners per key; review quota burn against the partner agreement on a regular cadence.
maintainers:
