publisherName: Climate Engine
serviceCategory: Analytics
billingModel:
  pricingCategory: Commitment-Based
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Climate Engine API
  ServiceCategory: Analytics
  ProviderName: Climate Engine
  PublisherName: Climate Engine
