- FOCUS
description: >-
  FinOps view of Climate Engine commercial API spend. Climate Engine sells API
  access through partner / sales-led agreements governed by per-account request
  quotas rather than publicly itemized per-call rates. Cost is therefore driven
  by the negotiated agreement and the volume of processing requests against the
  account quota. Because no public rate card is published, the meters below are
  modeled on the request-quota structure and are not reconciled to dollar rates.
notes: >-
  Itemized commercial rates are not published; verify the negotiated agreement
  and quota allocation with the Climate Engine team during reconciliation.
sources:
- https://www.climateengine.com
- https://support.climateengine.org/article/144-api-quota-policy
